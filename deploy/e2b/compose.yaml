name: swarm-hive-e2b-local
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/18/docker
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["../../data/e2b/postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  redis:
    image: redis:7.4.6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["../../data/e2b/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.30.16
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:18123:8123", "127.0.0.1:19000:9000"]
    volumes:
      - ../../data/e2b/clickhouse:/var/lib/clickhouse
      - ../../data/e2b/clickhouse-config.xml:/etc/clickhouse-server/config.d/e2b.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "clickhouse", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
