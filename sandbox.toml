# Quote destination paths containing '~' or '/'. Relative sources resolve from
# this file's directory.
[rw_mount]
"~/.meegle" = "./data/credentials/sandbox/meegle"
"~/.config/glab-cli" = "./data/credentials/sandbox/glab"
"~/.kube" = "./data/credentials/sandbox/kubernetes"
"~/.config/lark-cli" = "./data/credentials/sandbox/lark-config"
"~/.local/share/lark-cli" = "./data/credentials/sandbox/lark-data"
"~/.gitconfig" = "./data/credentials/sandbox/gitconfig"
"~/.git-credentials" = "./data/credentials/sandbox/git-credentials"
"~/.mylogin.cnf" = "./data/credentials/sandbox/.mylogin.cnf"
