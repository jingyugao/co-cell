# Image-wide runtimes. The first version is the default; all listed versions
# remain available through `mise exec <tool>@<version>` or project mise.toml.
[tools]
go = ["1.25", "1.24", "1.23", "1.23.0", "1.22", "1.22.2", "1.22.1", "1.21.0"]
python = ["3.14", "3.13", "3.12", "3.11", "3.10"]
node = ["22.18.0", "18"]

# Python 3.15 is not included: current mise/pyenv metadata has no definition,
# and listing it makes image builds fail. Add it when mise can resolve it.
