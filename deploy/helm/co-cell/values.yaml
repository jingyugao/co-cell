# Supply an image built from this repository. No registry or tag is assumed.
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Existing Secret in the release namespace. Required keys: CELLBOX_API_TOKEN,
# COCELL_ACCESS_TOKEN, MYSQL_URL. Optional keys: CODEX_API_KEY, OPENAI_API_KEY.
existingSecret: ""

cellbox:
  apiUrl: ""
  profile: ""

# HTTPS origin (or loopback HTTP origin). It must have no path, query, or hash.
publicUrl: ""

config:
  ossEndpoint: ""
  codexModel: ""
  openaiBaseUrl: ""
  codexProxyKind: ""
  # Relative credential source path -> Cellbox admitted debug credential slot.
  credentialSlots: {}

service:
  port: 3001

ingress:
  enabled: false
  previewSubdomains: false
  className: ""
  annotations: {}
  tlsSecretName: ""

persistence:
  existingClaim: ""
  size: 10Gi
  # null uses the cluster default; "" disables dynamic provisioning.
  storageClassName: null
  accessModes:
    - ReadWriteOnce

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
