name: Publish CoCell deployment

on:
  workflow_run:
    workflows: [Integration regression]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cocell-master-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CHART_REF: ${{ vars.COCELL_CHART_REF }}
      DEPLOY_URL: ${{ vars.COCELL_DEPLOY_WEBHOOK_URL }}
      DEPLOY_SECRET: ${{ secrets.COCELL_DEPLOY_WEBHOOK_SECRET }}
      CHART_KEY: ${{ secrets.COCELL_CHART_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check publication configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHART_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$DEPLOY_URL" && -n "$DEPLOY_SECRET" && -n "$CHART_KEY" ]]
          node -e 'try { const u = new URL(process.env.DEPLOY_URL); if (!["http:", "https:"].includes(u.protocol) || u.username || u.password) process.exit(1); } catch { process.exit(1); }'
      - name: Check triggering commit is current master
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded master commit.'
          fi
      - name: Checkout application source
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.current.outputs.publish == 'true'
        with:
          node-version: 22.18.0
      - name: Set image and chart identifiers
        if: steps.current.outputs.publish == 'true'
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/co-cell:$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "chart_registry=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"
          echo "chart_version=0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        if: steps.current.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cocell-web
          cache-to: type=gha,mode=max,scope=cocell-web
      - name: Recheck master before publishing chart
        if: steps.current.outputs.publish == 'true'
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping chart and deployment for superseded master commit.'
          fi
      - name: Checkout pinned chart source
        if: steps.recheck.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: jingyugao/k3s-helm
          ref: ${{ vars.COCELL_CHART_REF }}
          ssh-key: ${{ secrets.COCELL_CHART_DEPLOY_KEY }}
          persist-credentials: false
          path: .deployment-chart
      - uses: azure/setup-helm@v4
        if: steps.recheck.outputs.publish == 'true'
        with:
          version: v3.19.0
      - name: Package and publish chart
        if: steps.recheck.outputs.publish == 'true'
        id: chart
        env:
          CHART_VERSION: ${{ steps.names.outputs.chart_version }}
          CHART_REGISTRY: ${{ steps.names.outputs.chart_registry }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cocell-chart"
          helm package .deployment-chart/charts/co-cell --version "$CHART_VERSION" --app-version "$SOURCE_SHA" --destination "$RUNNER_TEMP/cocell-chart"
          archive="$RUNNER_TEMP/cocell-chart/co-cell-$CHART_VERSION.tgz"
          digest=$(sha256sum "$archive" | cut -d ' ' -f1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$archive" "$CHART_REGISTRY"
      - name: Verify image and chart allow anonymous pulls
        if: steps.recheck.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_VERSION: ${{ steps.names.outputs.chart_version }}
          CHART_REGISTRY: ${{ steps.names.outputs.chart_registry }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-docker" "$RUNNER_TEMP/public-chart"
          printf '{"auths":{}}' > "$RUNNER_TEMP/public-registry.json"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/co-cell@$IMAGE_DIGEST"
          if ! docker --config "$RUNNER_TEMP/public-docker" manifest inspect "$image" > /dev/null; then
            echo '::error::Set the co-cell container package visibility to Public, then rerun this workflow.'
            exit 1
          fi
          if ! helm pull "$CHART_REGISTRY/co-cell" --version "$CHART_VERSION" --registry-config "$RUNNER_TEMP/public-registry.json" --destination "$RUNNER_TEMP/public-chart"; then
            echo '::error::Set the charts/co-cell container package visibility to Public, then rerun this workflow.'
            exit 1
          fi
      - name: Recheck master before notification
        if: steps.recheck.outputs.publish == 'true'
        id: notify_check
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment for superseded master commit.'
          fi
      - name: Notify deployment receiver
        if: steps.notify_check.outputs.publish == 'true'
        env:
          CHART_VERSION: ${{ steps.names.outputs.chart_version }}
          CHART_SHA256: ${{ steps.chart.outputs.sha256 }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/deploy/notify-webhook.mjs
