# This Box intentionally supplies only Git configuration and credentials.
[sandbox]

[backup_ignore]
"workspace/.go-cache/" = true
"workspace/.uv-cache/" = true
"codex/AGENTS.md" = true
"codex/auth.json" = true

[rw_mount]
"~/.gitconfig" = "./data/credentials/sandbox/gitconfig"
"~/.git-credentials" = "./data/credentials/sandbox/git-credentials"
