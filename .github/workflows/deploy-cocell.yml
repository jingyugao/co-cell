name: Publish CoCell deployment

on:
  workflow_run:
    workflows: [Integration regression]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cocell-master-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CHART_REF: ${{ vars.COCELL_CHART_REF }}
      CHART_REPOSITORY: ${{ vars.COCELL_CHART_REPOSITORY }}
      DEPLOY_URL: ${{ vars.COCELL_DEPLOY_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check publication configuration
        shell: bash
        env:
          CHART_KEY: ${{ secrets.COCELL_CHART_DEPLOY_KEY }}
          DEPLOY_SECRET: ${{ secrets.COCELL_DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHART_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHART_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ -n "$DEPLOY_URL" && -n "$DEPLOY_SECRET" && -n "$CHART_KEY" ]]
          node -e 'try { const u = new URL(process.env.DEPLOY_URL); if (!["http:", "https:"].includes(u.protocol) || u.username || u.password) process.exit(1); } catch { process.exit(1); }'
      - name: Check triggering commit is current master
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded master commit.'
          fi
      - name: Checkout application source
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set image and chart identifiers
        if: steps.current.outputs.publish == 'true'
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/co-cell:$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_repository=ghcr.io/$owner/co-cell" >> "$GITHUB_OUTPUT"
          echo "chart_registry=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        if: steps.current.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cocell-web
          cache-to: type=gha,mode=max,scope=cocell-web
      - name: Checkout pinned deployment tools
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.COCELL_CHART_REPOSITORY }}
          ref: ${{ vars.COCELL_CHART_REF }}
          ssh-key: ${{ secrets.COCELL_CHART_DEPLOY_KEY }}
          persist-credentials: false
          path: .deployment-chart
      - name: Publish Chart and deploy through shared infrastructure
        if: steps.current.outputs.publish == 'true'
        uses: ./.deployment-chart/.github/actions/publish-helm
        with:
          source-repository: ${{ github.repository }}
          source-branch: master
          source-sha: ${{ github.event.workflow_run.head_sha }}
          image-repository: ${{ steps.names.outputs.image_repository }}
          image-digest: ${{ steps.image.outputs.digest }}
          chart-path: charts/co-cell
          chart-registry: ${{ steps.names.outputs.chart_registry }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
          source-token: ${{ github.token }}
          webhook-url: ${{ vars.COCELL_DEPLOY_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.COCELL_DEPLOY_WEBHOOK_SECRET }}
          enable-ipv6: ${{ vars.COCELL_DEPLOY_IPV6 }}
          require-public: 'true'
