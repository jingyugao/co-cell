services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swarm_hive}
      MYSQL_USER: ${MYSQL_USER:-swarm_hive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-before-production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password-before-production}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - swarm-hive-mysql-sqlrestore:/var/lib/mysql
    ports:
      - "${MYSQL_LISTEN:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  swarm-hive:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      cliproxy:
        condition: service_started
    restart: unless-stopped
    hostname: ${MEEGLE_AUTH_HOSTNAME:-swarm-hive}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      MEEGLE_HOST: ${MEEGLE_HOST:-}
      USER: ${MEEGLE_AUTH_USER:-root}
      MYSQL_URL: mysql://${MYSQL_USER:-swarm_hive}:${MYSQL_PASSWORD:-change-me-before-production}@mysql:3306/${MYSQL_DATABASE:-swarm_hive}
      DOCKER_SANDBOX_IMAGE: ${DOCKER_SANDBOX_IMAGE:-swarm-hive-sandbox:latest}
      DOCKER_SANDBOX_NETWORK: ${DOCKER_SANDBOX_NETWORK:-swarm-hive_default}
      DOCKER_HOST: tcp://host.docker.internal:2375
      SANDBOX_WORKSPACE: ${SANDBOX_WORKSPACE:-/home/user/workspace}
      # A stable host directory mounted read-only as the Sandbox's current
      # CLI credentials. Edit files below it to update existing Sandboxes.
      SANDBOX_CREDENTIALS_HOST_DIR: ${SANDBOX_CREDENTIALS_HOST_DIR:-${PWD}/data/credentials/sandbox}
      # Kept separate because it is an App Server capability secret, not a
      # CLI credential made available to agents.
      SANDBOX_APP_SERVER_TOKEN_HOST_PATH: ${SANDBOX_APP_SERVER_TOKEN_HOST_PATH:-${PWD}/data/credentials/sandbox-runtime/app-server-token}
      # Docker commands issued by this container are evaluated by the host
      # daemon, so this must be a host path rather than /app/data/AGENTS.md.
      SANDBOX_SHARED_AGENTS_PATH: ${SANDBOX_SHARED_AGENTS_PATH:-${PWD}/data/AGENTS.md}
      # Docker and the gVisor helper need host-visible sources for sandbox.toml.
      SANDBOX_MOUNT_ROOT: ${SANDBOX_MOUNT_ROOT:-${PWD}}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      GVISOR_BUNDLE_ROOT: ${GVISOR_BUNDLE_ROOT:-/var/lib/swarm-hive/gvisor/bundles}
      GVISOR_NETNS_ROOT: ${GVISOR_NETNS_ROOT:-/var/run/netns}
      GVISOR_APP_SERVER_HOST: host.docker.internal
      GVISOR_HELPER_URL: ${GVISOR_HELPER_URL:-http://host.docker.internal:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Docker sandbox mode intentionally has host-level Docker authority.
      # It is for trusted local deployments only.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GVISOR_BUNDLE_ROOT:-/var/lib/swarm-hive/gvisor/bundles}:/var/lib/swarm-hive/gvisor/bundles
      - ${MEEGLE_HOME:-./data/meegle}:/root/.meegle
    ports:
      - "127.0.0.1:3001:3001"
  cliproxy:
    image: eceasy/cli-proxy-api:v7.2.154
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/CLIProxyAPI/CLIProxyAPI"]
    command: ["--config", "/CLIProxyAPI/config.yaml"]
    environment:
      HOME: /tmp
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./data/cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./data/cliproxyapi/auths:/auths
      - ./data/cliproxyapi/logs:/CLIProxyAPI/logs
      - ${HOME}/.codex/auth.json:/tmp/codex-auth.json:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  swarm-hive-mysql-sqlrestore:
    external: true
    name: swarm-hive_swarm-hive-mysql-sqlrestore
