name: swarm-hive-native
services:
  native-control:
    build: .
    image: swarm-hive-native:local
    network_mode: host
    env_file: .env
    environment:
      AGENT_SERVER_HOST: 127.0.0.1
      AGENT_SERVER_PORT: ${AGENT_SERVER_PORT:-3000}
      AGENT_WEB_ROOT: /app/dist/web
      NATIVE_DATA_DIR: /app/data/native
      E2B_API_KEY_FILE: /app/data/e2b/api-key
    volumes:
      - ./data/native:/app/data/native
      - ./data/e2b/api-key:/app/data/e2b/api-key:ro
      - ${CODEX_AUTH_JSON_PATH:-/dev/null}:${CODEX_AUTH_JSON_PATH:-/etc/codex-auth-disabled}:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
