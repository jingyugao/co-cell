services:
  agent-control:
    build:
      context: .
    image: agent-staff-control:local
    environment:
      AGENT_SANDBOX: ${AGENT_SANDBOX:-shared-docker}
      AGENT_TEMPLATE_DIR: ${AGENT_TEMPLATE_DIR:-/app/templates/software-engineer}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-agent-staff-sandbox-python:3.12}
      AGENT_SHARED_SANDBOX_NAME: ${AGENT_SHARED_SANDBOX_NAME:-agent-staff-dev-sandbox}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      AGENT_WORKSPACE_ROOT: ${AGENT_WORKSPACE_ROOT:-/srv/agent-workspaces}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AGENT_CHECKPOINT_DATABASE_URL: ${AGENT_CHECKPOINT_DATABASE_URL:-}
      AGENT_CHECKPOINT_SCHEMA: ${AGENT_CHECKPOINT_SCHEMA:-public}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_USERNAME: ${GITLAB_USERNAME:-oauth2}
      GITLAB_REPOSITORY: ${GITLAB_REPOSITORY:-}
      GITLAB_FEATURE_BRANCH: ${GITLAB_FEATURE_BRANCH:-}
      GITLAB_TARGET_BRANCH: ${GITLAB_TARGET_BRANCH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep the same absolute path on host and in this container. The host
      # Docker daemon resolves bind-mount source paths in the host namespace.
      - ${AGENT_WORKSPACE_ROOT:-/srv/agent-workspaces}:${AGENT_WORKSPACE_ROOT:-/srv/agent-workspaces}

  sandbox-python-image:
    profiles: ["images"]
    build:
      context: .
      dockerfile: ${AGENT_SANDBOX_DOCKERFILE:-templates/software-engineer/sandbox/Dockerfile}
    image: ${AGENT_SANDBOX_IMAGE:-agent-staff-sandbox-python:3.12}
    command: ["true"]

  checkpoint-postgres:
    profiles: ["persistence"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-agent_staff}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-REDACTED_PASSWORD}
    ports:
      - 127.0.0.1:${AGENT_POSTGRES_PORT:-55432}:5432
    volumes:
      - agent-checkpoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  agent-checkpoint-postgres-data:
