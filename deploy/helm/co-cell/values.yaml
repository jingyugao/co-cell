# Supply an image built from this repository. No registry or tag is assumed.
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

tracing:
  endpoint: ""
  serviceName: co-cell

# Existing Secret in the release namespace. Required keys: COCELL_ACCESS_TOKEN, MYSQL_URL, COCELL_SECRET_MASTER_KEY.
# Optional keys: CODEX_API_KEY, OPENAI_API_KEY.
existingSecret: ""

cellbox:
  apiUrl: ""
  # Optional data namespace. Empty uses the Cellbox API's configured default.
  clientId: ""
  profile: ""

# HTTPS origin (or loopback HTTP origin). It must have no path, query, or hash.
publicUrl: ""

config:
  # Defaults to this release's internal service origin.
  toolBrokerUrl: ""
  ossEndpoint: ""
  codexModel: ""
  openaiBaseUrl: ""
  codexProxyKind: ""
  # External model name -> installed catalog template plus capability overrides.
  codexModelMetadata: {}
  # Relative credential source path -> Cellbox admitted debug credential slot.
  credentialSlots: {}

service:
  port: 3001

ingress:
  enabled: false
  previewSubdomains: false
  className: ""
  annotations: {}
  tlsSecretName: ""
  previewTlsSecretName: ""

persistence:
  existingClaim: ""
  size: 10Gi
  # null uses the cluster default; "" disables dynamic provisioning.
  storageClassName: null
  accessModes:
    - ReadWriteOnce

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
sharedDirectory:
  enabled: false
  # Pre-created node directory owned by the web uid (1000), separate from data.
  hostPath: ""
  # Must match the Cellbox profile's nodeName.
  nodeName: ""
tolerations: []
affinity: {}
